<!doctype html>
<html lang="ko">
<head>
<title>같은 숫자 찾기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#151D2B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="같은 숫자">
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
  [hidden]{display:none!important}
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  :root{
    color-scheme: dark;
    --felt:#1F2A3C;
    --felt-deep:#151D2B;
    --bar:#101724;
    --ink:#ECE5D3;
    --ink-dim:#A3AEC2;
    --brass:#D8A445;
    --brass-ink:#2A1D06;
    --line:rgba(236,229,211,.14);
    --chip:rgba(236,229,211,.06);
    --paper:#FBF6EA;
    --type:#1D1A16;
  }
  html{box-sizing:border-box;height:100%}
  *,*::before,*::after{box-sizing:inherit}
  body{
    height:100%;margin:0;overflow:hidden;overscroll-behavior:none;
    background:var(--felt-deep);color:var(--ink);
    font:400 15px/1.4 "IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  }
  .app{position:relative;height:100%}
  /* 화면이 세로면 게임 화면 전체를 90도 돌려 세로 화면을 꽉 채운다 — 태블릿을 옆으로 돌려 들면 가로 화면처럼 보임 (자동회전 꺼도 됨) */
  @media (orientation:portrait){
    .app{position:fixed;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg)}
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:58px;padding:0 18px;
    border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);
    font-family:inherit;font-size:19px;font-weight:500;line-height:1.2;cursor:pointer;touch-action:manipulation;white-space:nowrap;
  }
  .btn:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn.primary{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .btn[aria-pressed="true"]{background:rgba(216,164,69,.16);border-color:var(--brass);color:var(--brass)}
  .seg{display:flex;align-items:center;gap:6px}
  .seg .btn{flex:1 1 0;min-width:0;padding:0 4px;font-size:18px}
  .seg .btn[aria-pressed="true"]{background:var(--brass);color:var(--brass-ink);border-color:transparent;font-weight:700}
  .stage{position:absolute;inset:0;background:var(--felt)}

  /* 위: 문제 번호 · 할 일 */
  .qbar{position:absolute;left:16px;top:12px;right:calc(var(--sp) + 16px);display:flex;align-items:center;gap:14px;min-height:54px}
  .qno{flex:none;padding:6px 14px;border-radius:12px;background:var(--brass);color:var(--brass-ink);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .ask{font-size:22px;font-weight:700;line-height:1.25}
  .ask b{color:var(--brass)}

  /* 숫자판 */
  .board{position:absolute;background:var(--paper);border:4px solid #2C2620;border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.45);overflow:hidden;display:grid}
  .cell{
    position:relative;display:grid;place-items:center;border-right:2px solid #3A332B;border-bottom:2px solid #3A332B;
    color:var(--type);font-weight:700;font-size:calc(var(--cs)*.5);line-height:1;cursor:pointer;touch-action:manipulation;font-variant-numeric:tabular-nums;
    padding:0;background:transparent;font-family:inherit;border-top:0;border-left:0
  }
  .cell.lastc{border-right:0}
  .cell.lastr{border-bottom:0}
  /* 찾은 짝: 색 동그라미 */
  .cell::before{content:"";position:absolute;inset:10%;border-radius:50%;background:var(--c,transparent);opacity:.75;z-index:-1}
  .cell span{position:relative}
  .cell.sel{background:rgba(216,164,69,.55);box-shadow:inset 0 0 0 4px #B9832A}
  .cell.wrong{background:rgba(194,90,69,.45)}
  .cell.flash{animation:flash .9s ease-in-out 4}
  @keyframes flash{50%{background:rgba(255,214,110,.95)}}
  @media (prefers-reduced-motion:reduce){ .cell.flash{animation:none;background:rgba(255,214,110,.9)} }
  .board{isolation:isolate}

  /* 오른쪽: 설정 · 찾은 짝 · 힌트 */
  .side{position:absolute;top:0;right:0;bottom:0;width:var(--sp);display:flex;flex-direction:column;gap:12px;padding:12px;background:var(--bar);border-left:1px solid var(--line)}
  .gear{min-height:54px;font-size:20px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .pairs{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center}
  .pairs h4{margin:0;color:var(--ink-dim);font-size:17px;font-weight:500}
  .pair{display:grid;place-items:center;width:min(130px,80%);height:54px;border-radius:14px;border:2px dashed rgba(236,229,211,.35);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
  .pair.ok{border:0;background:var(--c);color:#1D1A16}
  .count{text-align:center;color:var(--ink-dim);font-size:16px}
  .count b{color:var(--brass);font-size:20px}
  .hintb{min-height:60px;font-size:21px;font-weight:700;background:var(--brass);color:var(--brass-ink);border-color:transparent}

  .cheer{position:absolute;left:calc((100% - var(--sp))/2);top:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;white-space:nowrap;
    padding:14px 36px;border-radius:22px;background:rgba(16,23,36,.93);border:2px solid var(--brass);box-shadow:0 14px 40px rgba(0,0,0,.5);
    font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-size:60px;line-height:1.1;color:var(--brass)}
  .veil{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,12,20,.55);overflow:auto;z-index:4}
  .card{
    width:min(100%,460px);padding:26px 24px 24px;border-radius:18px;
    background:var(--bar);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);
    display:flex;flex-direction:column;gap:18px
  }
  .card h2{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:44px;line-height:1;color:var(--brass)}
  .card h3{margin:0;font-family:"Do Hyeon","IBM Plex Sans KR",sans-serif;font-weight:400;font-size:30px;line-height:1;color:var(--brass)}
  .card .big{margin:0;font-size:24px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .wide{grid-column:1 / -1}
  .note{margin:0;color:var(--ink-dim);font-size:15px}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">
    <div class="qbar">
      <span class="qno"><span id="qNo">1</span> / <span id="qT">5</span></span>
      <span class="ask" id="ask"></span>
    </div>
    <div class="board" id="board" role="grid" aria-label="숫자판"></div>
    <aside class="side" id="side">
      <button id="gear" class="btn gear" type="button">설정</button>
      <div class="pairs" id="pairs" aria-live="polite"></div>
      <div class="count">찾은 짝 <b id="cnt">0/3</b></div>
      <button id="hint" class="btn hintb" type="button">힌트</button>
    </aside>
    <div class="cheer" id="cheer" hidden>잘하셨어요!</div>

    <div class="veil" id="menu" hidden>
      <div class="card" role="dialog" aria-label="설정">
        <h3>설정</h3>
        <div class="grid2">
          <div id="level" class="seg wide" role="group" aria-label="난이도">
            <button class="btn" type="button" data-v="1" aria-pressed="true">쉬움</button>
            <button class="btn" type="button" data-v="2" aria-pressed="false">보통</button>
            <button class="btn" type="button" data-v="3" aria-pressed="false">어려움</button>
          </div>
          <button id="sound" class="btn" type="button" aria-pressed="true">소리</button>
          <button id="again" class="btn" type="button">새 문제로</button>
          <button id="full" class="btn wide" type="button">전체 화면</button>
        </div>
        <p class="note">숫자판에 두 번 나오는 숫자가 있어요. 같은 숫자 두 개를 차례로 누르면 동그라미가 쳐져요. 쉬움 12칸 2쌍 · 보통 24칸 3쌍 · 어려움 35칸 4쌍(69와 96처럼 헷갈리는 숫자도 섞여요).</p>
        <p class="note">버전 11월 5일</p>
        <button id="menuClose" class="btn primary" type="button">닫고 하기</button>
      </div>
    </div>

    <div class="veil" id="done" hidden>
      <div class="card">
        <h2>다 찾으셨어요!</h2>
        <p class="big" id="dScore"></p>
        <button id="doneAgain" class="btn primary" type="button">한 번 더 하기</button>
      </div>
    </div>
  </main>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), board = $('#board');
  const PREFS = 'same.prefs', KEY = 'same.game';
  const LEVELS = {
    1: { cols: 4, rows: 3, pairs: 2, max: 50, tricky: 0 },
    2: { cols: 6, rows: 4, pairs: 3, max: 99, tricky: 1 },
    3: { cols: 7, rows: 5, pairs: 4, max: 99, tricky: 3 }
  };
  const ROUND_N = 5;
  const RING = ['#F2C14E', '#7FC8A9', '#F49FB6', '#8AB6F0', '#C9A2E8'];

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };
  let prefs = { level: 1, sound: true };
  try { Object.assign(prefs, JSON.parse(store.get(PREFS) || '{}')); } catch(e){}
  if (!LEVELS[prefs.level]) prefs.level = 1;
  const savePrefs = () => store.set(PREFS, JSON.stringify(prefs));
  const pick = a => a[Math.floor(Math.random()*a.length)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- 문제 만들기 ----------
  // 짝 숫자만 두 번, 나머지는 모두 한 번씩. 어려울수록 짝 숫자를 뒤집은 숫자(73 ↔ 37)를 섞어 헷갈리게
  function makePuzzle(level){
    const L = LEVELS[level], n = L.cols*L.rows;
    const nums = shuffle(Array.from({ length: L.max }, (_, i) => i + 1));
    const pairs = nums.slice(0, L.pairs), used = new Set(pairs), rest = [];
    for (const p of pairs){
      if (rest.length >= L.tricky) break;
      const r = +String(p).split('').reverse().join('');
      if (p >= 10 && r !== p && r % 10 !== 0 && r <= L.max && !used.has(r)){ rest.push(r); used.add(r); }
    }
    for (const v of nums){ if (rest.length >= n - 2*L.pairs) break; if (!used.has(v)){ rest.push(v); used.add(v); } }
    const grid = shuffle(pairs.concat(pairs, rest));
    return { level, cols: L.cols, rows: L.rows, grid, pairs: pairs.map(v => ({ v, found: false })) };
  }

  // ---------- 한 판 ----------
  let G = null, sel = -1, busy = false;
  function newRound(){
    G = { at: 1, hints: 0, pz: makePuzzle(prefs.level) };
    $('#done').hidden = true; $('#menu').hidden = true;
    show(); save();
  }
  function nextProblem(){
    if (G.at >= ROUND_N){ finish(); return; }
    G.at++; G.pz = makePuzzle(prefs.level); G.hint = null;
    show(); save();
  }
  function finish(){
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, .18), i*110));
    $('#dScore').textContent = G.hints ? `${ROUND_N}문제를 다 풀었어요. 힌트는 ${G.hints}번 썼어요.` : `${ROUND_N}문제를 힌트 없이 다 풀었어요!`;
    $('#done').hidden = false;
    G.over = true; save();
  }
  function show(){
    const pz = G.pz;
    sel = -1;
    $('#qNo').textContent = G.at; $('#qT').textContent = ROUND_N;
    $('#ask').innerHTML = `똑같은 숫자 <b>${pz.pairs.length}쌍</b>을 찾아보세요`;
    board.textContent = '';
    board.style.gridTemplateColumns = `repeat(${pz.cols}, 1fr)`;
    pz.grid.forEach((v, i) => {
      const d = document.createElement('button');
      d.type = 'button';
      d.className = 'cell' + (i % pz.cols === pz.cols - 1 ? ' lastc' : '') + (i >= (pz.rows - 1)*pz.cols ? ' lastr' : '');
      d.dataset.i = i; d.innerHTML = `<span>${v}</span>`; d.setAttribute('aria-label', '숫자 ' + v);
      board.appendChild(d);
    });
    syncPairs();
    layout();
  }
  function syncPairs(){
    const pz = G.pz, box = $('#pairs');
    box.innerHTML = '<h4>찾은 짝</h4>';
    pz.pairs.forEach((p, k) => {
      const d = document.createElement('div');
      d.className = 'pair' + (p.found ? ' ok' : '');
      d.style.setProperty('--c', RING[k % RING.length]);
      d.textContent = p.found ? p.v : '?';
      box.appendChild(d);
    });
    $('#cnt').textContent = `${pz.pairs.filter(p => p.found).length}/${pz.pairs.length}`;
    for (const el of board.children){
      const v = pz.grid[+el.dataset.i], k = pz.pairs.findIndex(p => p.found && p.v === v);
      el.style.setProperty('--c', k >= 0 ? RING[k % RING.length] : 'transparent');
    }
  }

  // ---------- 누르기: 같은 숫자 두 개를 차례로 ----------
  board.addEventListener('click', e => {
    const el = e.target.closest('.cell');
    if (!el || busy || !G || G.over) return;
    wakeAudio();
    const i = +el.dataset.i, pz = G.pz, v = pz.grid[i];
    if (pz.pairs.some(p => p.found && p.v === v)){ beep(330, .06); return; } // 이미 찾은 숫자
    if (sel < 0){ sel = i; el.classList.add('sel'); beep(520, .04); return; }
    const a = board.children[sel];
    if (sel === i){ a.classList.remove('sel'); sel = -1; return; }
    if (pz.grid[sel] === v){
      a.classList.remove('sel'); sel = -1;
      const k = pz.pairs.findIndex(p => p.v === v); pz.pairs[k].found = true;
      if (G.hint && G.hint.k === k) G.hint = null;
      [659, 880].forEach((f, n) => setTimeout(() => beep(f, .14), n*120));
      syncPairs(); save();
      if (pz.pairs.every(p => p.found)) solved();
    } else {
      busy = true; el.classList.add('wrong'); a.classList.add('wrong'); beep(220, .15);
      setTimeout(() => { el.classList.remove('wrong'); a.classList.remove('wrong', 'sel'); sel = -1; busy = false; }, 650);
    }
  });
  function solved(){
    busy = true;
    const ch = $('#cheer'); ch.textContent = pick(['잘하셨어요!', '훌륭해요!', '다 찾았어요!']); ch.hidden = false;
    setTimeout(() => { ch.hidden = true; busy = false; nextProblem(); }, 1700);
  }

  // ---------- 힌트: 누를 때마다 더 많이 (짝 하나가 반짝 → 둘 다 반짝) ----------
  $('#hint').addEventListener('click', () => {
    if (!G || G.over || busy) return;
    wakeAudio();
    const pz = G.pz, k = pz.pairs.findIndex(p => !p.found);
    if (k < 0) return;
    if (!G.hint || G.hint.k !== k) G.hint = { k, step: 0 };
    G.hint.step = Math.min(2, G.hint.step + 1); G.hints++;
    const at = pz.grid.map((v, i) => v === pz.pairs[k].v ? i : -1).filter(i => i >= 0);
    const cells = G.hint.step === 1 ? [at[0]] : at;
    for (const el of board.children) el.classList.remove('flash');
    void board.offsetWidth;
    for (const i of cells) board.children[i].classList.add('flash');
    setTimeout(() => { for (const i of cells) board.children[i] && board.children[i].classList.remove('flash'); }, 3800);
    beep(740, .08);
    save();
  });

  // ---------- 화면 배치 ----------
  function layout(){
    const W = stage.clientWidth, H = stage.clientHeight;
    const sp = Math.round(Math.min(280, Math.max(200, W*.2)));
    stage.style.setProperty('--sp', sp + 'px');
    if (!G || !G.pz) return;
    const pz = G.pz, top = 80, pad = 18, aw = W - sp - 2*pad, ah = H - top - pad;
    const cs = Math.floor(Math.min(aw/pz.cols, ah/pz.rows));
    board.style.width = (cs*pz.cols + 8) + 'px'; board.style.height = (cs*pz.rows + 8) + 'px';
    board.style.left = Math.round(pad + (aw - cs*pz.cols)/2) + 'px';
    board.style.top = Math.round(top + (ah - cs*pz.rows)/2) + 'px';
    board.style.setProperty('--cs', cs + 'px');
    board.style.gridAutoRows = cs + 'px';
  }

  // ---------- 저장 (껐다 켜도 이어서) ----------
  function save(){ if (G) store.set(KEY, JSON.stringify({ v: 1, level: prefs.level, at: G.at, hints: G.hints, over: !!G.over, pz: G.pz, hint: G.hint || null })); }
  function restore(){
    try {
      const s = JSON.parse(store.get(KEY) || 'null');
      if (!s || s.v !== 1 || s.over || !s.pz || s.level !== prefs.level || !Array.isArray(s.pz.grid)) return false;
      G = { at: s.at, hints: s.hints || 0, pz: s.pz, hint: s.hint };
      show(); return true;
    } catch(e){ return false; }
  }

  // ---------- 소리 ----------
  let ac = null;
  function wakeAudio(){
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch(e){}
  }
  function beep(freq, dur){
    if (!prefs.sound || !ac) return;
    try {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'triangle'; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(.22, t + .006);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
    } catch(e){}
  }

  // ---------- 설정 ----------
  const toggle = (btn, on) => btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  function syncSeg(){ for (const b of $('#level').querySelectorAll('[data-v]')) toggle(b, +b.dataset.v === prefs.level); }
  $('#level').addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || +b.dataset.v === prefs.level) return;
    prefs.level = +b.dataset.v; savePrefs(); syncSeg(); newRound();
  });
  $('#sound').addEventListener('click', e => { prefs.sound = !prefs.sound; savePrefs(); toggle(e.currentTarget, prefs.sound); if (prefs.sound){ wakeAudio(); beep(660, .08); } });
  $('#again').addEventListener('click', newRound);
  $('#doneAgain').addEventListener('click', newRound);
  $('#gear').addEventListener('click', () => { $('#menu').hidden = false; });
  $('#menuClose').addEventListener('click', () => { $('#menu').hidden = true; });
  const fullBtn = $('#full'), fsEl = document.documentElement;
  if (!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen)) fullBtn.hidden = true;
  fullBtn.addEventListener('click', () => {
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const r = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (r && r.catch) r.catch(() => {}); }
    } catch(e){}
    $('#menu').hidden = true;
  });

  toggle($('#sound'), prefs.sound); syncSeg();
  new ResizeObserver(layout).observe(stage);
  if (!restore()) newRound();
  window.__same = { makePuzzle, get G(){ return G; } }; // 점검용
})();
</script>

<script>
  if (matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches){ const b = document.getElementById('full'); if (b) b.hidden = true; }
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
